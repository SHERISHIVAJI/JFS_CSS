<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background: red;
  transition-property: width, height;
  
}

div:hover {
  width: 300px;
  height: 300px;
}
</style>
</head>
<body>

<h1>The transition-property Property</h1>

<div></div>

<p>Hover over the div element above, to see the transition effect.</p>

</body>
</html>
