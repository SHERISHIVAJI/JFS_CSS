<!DOCTYPE html>
<html>
<head>
<style>
#myDIV {
  width: 100px;
  height: 100px;
  background-color: coral;
  color: green;
  animation: mymove 5s infinite;
  clip-path: circle(50%);
}

@keyframes mymove {
  50% {clip-path: circle(20%);}
}
</style>
</head>
<body>

<h1>Animation of clip-path and circle()</h1>

<div id="myDIV">
  <h1>myDIV</h1>
</div>

</body>
</html>
