<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            width: 500px;
            height: 100%;
        }

        img {
            width: 100%;
            height: auto;
        }

        .mask1 {
            mask-image: url(./images/w3schools-removebg-preview.png);
            mask-size: 50%;
            mask-repeat: repeat;
        }

        .mask2 {
            mask-image: url(./images/w3schools-removebg-preview.png);
            mask-size: 50%;
            mask-repeat: repeat-x;
        }

        .mask3 {
            mask-image: url(./images/w3schools-removebg-preview.png);
            mask-size: 50%;
            mask-repeat: repeat-y;
        }

        .mask4 {
            mask-image: url(./images/w3schools-removebg-preview.png);
            mask-size: 50%;
            mask-repeat: space;
        }

        .mask5 {
            mask-image: url(./images/w3schools-removebg-preview.png);
            mask-size: 50%;
            mask-repeat: round;
        }

        .mask6 {
            mask-image: url(./images/w3schools-removebg-preview.png);
            mask-size: 50%;
            mask-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div>

        <h1>The mask-repeat Property</h1>

        <h3>Set mask-repeat: repeat:</h3>
        <div class="mask1">
            <img src="./images/1780541957243.jpg">
        </div>

        <h3>Set mask-repeat: repeat-x:</h3>
        <div class="mask2">
            <img src="./images/1780541957243.jpg">
        </div>

        <h3>Set mask-repeat: repeat-y:</h3>
        <div class="mask3">
            <img src="./images/1780541957243.jpg">
        </div>

        <h3>Set mask-repeat: space:</h3>
        <div class="mask4">
            <img src="./images/1780541957243.jpg">
        </div>

        <h3>Set mask-repeat: round:</h3>
        <div class="mask5">
            <img src="./images/1780541957243.jpg">
        </div>

        <h3>Set mask-repeat: no-repeat:</h3>
        <div class="mask6">
            <img src="./images/1780541957243.jpg">
        </div>

        <h3>Original image:</h3>
        <img src="./images/1780541957243.jpg">
    </div>
</body>

</html>
