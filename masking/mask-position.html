<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            width: 500px;
            height: 100%;
        }

        img {
            width: 100%;
            height: auto;
        }

        .mask1 {
            mask-image: url(./images/w3schools-removebg-preview.png);
            mask-size: 50%;
            mask-repeat: no-repeat;
            mask-position: center;
        }
    </style>
</head>

<body>
    <div>
        <h1>The mask-position Property</h1>

        <h3>Set the position of the mask layer image to center:</h3>
        <div class="mask1">
            <img src="./images/1780541957243.jpg">
        </div>

        <h3>Original image:</h3>
        <img src="./images/1780541957243.jpg">

    </div>
</body>

</html>
