<!DOCTYPE html>
<html>
<head>
<style>
div {
  width: 100px;
  height: 100px;
  background-color: lightgreen;
  border: 2px solid black;
  padding: 10px;
}

#myDiv1 {
  transform: rotateZ(40deg);
}

#myDiv2 {
  transform: rotateZ(60deg);
}

#myDiv3 {
  transform: rotateZ(-45deg);
}
</style>
</head>
<body>

<h1>The rotateZ() function</h1>

<div>
This a normal div element.
</div>

<div id="myDiv1">
Div1.
</div>

<div id="myDiv2">
Div2.
</div>

<div id="myDiv3">
Div3.
</div>

</body>
</html>
