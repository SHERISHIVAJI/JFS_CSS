<!DOCTYPE html>
<html>
<head>
<style> 
#main {
  width: 300px;
  height: 200px;
  border: 1px solid #c3c3c3;
  display: grid;
  justify-content: end;
}

#main div {
  width: 50px;
  height: 50px;
}
</style>
</head>
<body>

<h1>The justify-content Property</h1>

<p>The "justify-content: end;" displays the grid items to the right:</p>

<div id="main">
  <div style="background-color:coral;">1</div>
  <div style="background-color:lightblue;">2</div>
  <div style="background-color:pink;">3</div>
</div>

</body>
</html>
