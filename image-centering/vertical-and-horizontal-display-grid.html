<!DOCTYPE html>
<html>
<head>
<style>
div {
  display: grid;
  place-items: center; /* Align items to the center of the grid cell */
  height: 800px;
  border: 1px solid black;  
}

img {
  width: 30%;
}
</style>
</head>
<body>

<h2>True Centering With display: grid</h2>
<p>Here, the image is both vertically and horizontally centered with display:grid:</p>

<div>
  <img src="./images/1780542450429.jpg">
</div>

</body>
</html>
