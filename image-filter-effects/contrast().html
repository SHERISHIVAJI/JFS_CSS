<!DOCTYPE html>
<html>
<head>
<style>
div.background {
  background: lightblue url(./images/1780542450429.jpg) no-repeat center;
  background-size: cover;
  align-items: center;
  display: flex;
  justify-content: center;
  height: 400px;
  width: 400px;
}

div.transbox {
  background-color: rgba(255, 255, 255, 0.4);
  backdrop-filter: contrast(150%);
  padding: 20px;
  margin: 30px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>The contrast() Function</h1>

<div class="background">
  <div class="transbox">
    <p>backdrop-filter: contrast(150%)</p>
  </div>
</div>

</body>
</html>
