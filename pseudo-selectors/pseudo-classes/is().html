<!DOCTYPE html>
<html>
<head>
<style>
:is(p.intro, ul, ol) {
  color: red;
}
</style>
</head>
<body>

<h1>Demo of :is()</h1>

<p class="intro">This is some text with class="intro".</p>

<p>Example of unordered list:</p>
<ul>
  <li>Coffee</li>
  <li>Tea</li>
  <li>Coca Cola</li>
</ul>

<p>Example of ordered list:</p>
<ol>
  <li>Coffee</li>
  <li>Tea</li>
  <li>Coca Cola</li>
</ol>

<p>This is some text.</p>

</body>
</html>
