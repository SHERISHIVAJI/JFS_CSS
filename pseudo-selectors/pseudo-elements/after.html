<!DOCTYPE html>
<html>

<head>
    <style>
        p {
            background-color: red;
        }
        p::after {
            content: " - Remember this";
        }
    </style>
</head>

<body>

    <h1>Demo of ::after</h1>

    <p>My name is Donald.</p>
    <p>I live in Duckburg.</p>

</body>

</html>
