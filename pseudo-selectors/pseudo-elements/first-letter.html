<!DOCTYPE html>
<html>
<head>
<style>
p::first-letter {
  font-size: 200%;
  font-weight: bold;
  color: #8A2BE2;
}
span::first-letter {
    color: red;
    font-size: 200%;
}

div::first-letter {
    color: red;
    font-size: 200%;
}
</style>
</head>
<body>

<h1>Demo of ::first-letter</h1>

<p>My name is Donald.</p>
<p>My best friend is Mickey.</p>
<p>We live in Duckburg.</p>
<span>Hello</span>
<div>Hello</div>

</body>
</html>
