<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
}

.topleft {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background-color: black;
  color: white;
  border-radius: 5px;
  padding: 10px;
  font-size: 20px;
}

img { 
  width: 100%;
  height: auto;
  opacity: 0.5;
}
</style>
</head>
<body>

<h2>Image Text</h2>

<p>Add some text to an image in the top left corner:</p>

<div class="container">
  <img src="../images/1770298735099.png" alt="Cinque Terre" width="600" height="400">
  <div class="topleft">Top Left Text</div>
</div>

</body>
</html>
