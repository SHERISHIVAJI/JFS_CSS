<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #img1 {
            border-radius: 10px;
        }

        #img2 {
            border-radius: 50%;
        }

        #img3, #img4 {
            border: 2px solid #ddd;
            border-radius: 4px;
            padding: 5px;
        }

        #img4:hover {
            box-shadow: 0 0 5px 1px rgba(0, 140, 180, 0.5);
        }
    </style>
</head>
<body style="text-align: center;">
    <h2>Rounded Image</h2>
    <img id="img1" src="./images/1770298735099.png">
    <img id="img2" src="./images/1770298735099.png">
    <img id="img3" src="./images/1770298735099.png">
    <img id="img4" src="./images/1770298735099.png">
</body>
</html>
