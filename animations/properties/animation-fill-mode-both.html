<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background: red;
  position: relative;
  animation: mymove 5s;
  animation-fill-mode: both;
}

@keyframes mymove {
  from {left: 0px;}
  to {left: 90%; background-color: blue;}
}
</style>
</head>
<body>

<h1>animation-fill-mode: both</h1>

<p>Let the div element retain the style values from the last keyframe when the animation ends:</p>

<div></div>

</body>
</html>
