<!-- 
Responsive Modal Image Gallery
================================

A modal image gives a user the ability to display a larger version of an image, without navigating away from the current page. When a user clicks on a modal image, it shows a popup window that appears on top of the main content of the webpage, often with a semi-transparent background. The modal must be closed by the user, typically with a "close" button or an "X" sign in top-right corner. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            padding: 0 15px;
        }

        .gallery-item {
            position: relative;
            width: calc(25% - 20px);
            height: auto;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover {
            transform: scale(1.1);
        }

        .model {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .model-content {
            position: relative;
            width: 90%;
            height: auto;
            max-width: 90%;
            max-height: 90%;
            border-radius: 5px;
            overflow: hidden;
            animation: zoomIn 0.5s;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.6);
            }
            to {
                transform: scale(1);
            }
        }

        .model.show {
            display: flex;
            opacity: 1;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ffffff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .caption {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 24px;
        }

        @media  screen and (max-width : 768px) {
            .gallery-item {
                width: calc(50% - 20px);
            }
        }

        @media screen and (max-width: 480px) {
            .gallery-item {
                width: calc(100% - 20px);
            }
        }
    </style>
</head>
<body>
    <h1>Responsive Modal Images</h1>

    <div class="gallery">
        <img src="./images/1780541957243.jpg" alt="wall side" class="gallery-item" height="600" width="400" onclick="openModel('model1', 'wall side')">
        <img src="./images/1780542223500.jpg" alt="wall front" class="gallery-item" height="600" width="400" onclick="openModel('model2', 'wall front')">
        <img src="./images/1780542450429.jpg" alt="bench front" class="gallery-item" height="600" width="400" onclick="openModel('model3', 'bench front')">
        <img src="./images/1780542722927.jpg" alt="bench stand" class="gallery-item" height="600" width="400" onclick="openModel('model4', 'bench stand')">
    </div>

    <div class="model" id="model1">
        <span class="close" onclick="closeModel('model1')">&times;</span>
        <img src="./images/1780541957243.jpg" alt="wall side" class="model-content" height="600" width="400">
        <div class="caption"></div>
    </div>

    <div class="model" id="model2">
        <span class="close" onclick="closeModel('model2')">&times;</span>
        <img src="./images/1780542223500.jpg" alt="wall front" class="model-content" height="600" width="400">
        <div class="caption"></div>
    </div>

    <div class="model" id="model3">
        <span class="close" onclick="closeModel('model3')">&times;</span>
        <img src="./images/1780542450429.jpg" alt="bench front" class="model-content" height="600" width="400">
        <div class="caption"></div>
    </div>

    <div class="model" id="model4">
        <span class="close" onclick="closeModel('model4')">&times;</span>
        <img src="./images/1780542722927.jpg" alt="bench stand" class="model-content" height="600" width="400">
        <div class="caption"></div>
    </div>

    <script>
        function openModel(modelId, caption) {
            let model = document.getElementById(modelId)
            model.style.display = "flex"
            model.classList.add("show")
            let msg = model.querySelector(".caption")
            msg.innerHTML = caption
        }

        function closeModel(modelId) {
            let model = document.getElementById(modelId)
            model.classList.remove("show")
            setTimeout(function () {
                model.style.display = "none"                
                model.querySelector(".caption").innerHTML = ""
            }, 300);
        }
    </script>
</body>
</html>
