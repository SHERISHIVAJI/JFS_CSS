<!DOCTYPE html>
<html>
<head>
<style>
div {
  width: 100px;
  height: 100px;
  background-color: lightgreen;
  border: 2px solid black;
  padding: 10px;
}

#myDiv1 {
  transform: scaleX(0.7);
}

#myDiv2 {
  transform: scaleX(90%);
}

#myDiv3 {
  transform: scaleX(1.1);
}
</style>
</head>
<body>

<h1>The scaleX() function</h1>

<div>
This a normal div element.
</div>

<div id="myDiv1">
Div1.
</div>

<div id="myDiv2">
Div2.
</div>

<div id="myDiv3">
Div3.
</div>

</body>
</html>
